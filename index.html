<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM Development Diary</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>LLM Development Diary</h1>
    <nav>
        <a href="index.html">Reports</a>
        <a href="portraits.html">Our Portrait Page</a>
        <a href="experiments.html">Experiments</a>
        <a href="people.html">Individuals</a>
    </nav>
</header>

<main id="reports-container">
    <!-- Reports injected here -->
</main>

<footer>
    © LLM Research Diary
</footer>

<script src="js/reports.js"></script>
<script>
    const container = document.getElementById("reports-container");

    reports.forEach(report => {
        const section = document.createElement("section");
        section.className = "report";

        section.innerHTML = `
            <h2>${report.title}</h2>
            <div class="meta">${report.date}</div>
            ${report.content}
        `;

        container.appendChild(section);
    });
</script>

</body>
</html>
